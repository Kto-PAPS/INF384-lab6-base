name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y verificar cobertura
        run: npm test -- --coverage

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exportar archivos versionados
        run: |
          mkdir -p /tmp/gitleaks-src
          git archive HEAD | tar -x -C /tmp/gitleaks-src

      - name: Detectar secretos con Gitleaks
        run: |
          docker run --rm \
            -v /tmp/gitleaks-src:/path \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /path --redact --exit-code 1